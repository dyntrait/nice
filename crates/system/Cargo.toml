[package]
name = "nice-system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "System orchestration for the nice trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nice_system"
crate-type = ["rlib"]

[features]
default = []
defi = ["nice-common/defi", "nice-data/defi", "nice-model/defi"]
extension-module = [ "streaming"]
live = ["nice-common/live"]

streaming = ["dep:jiff", "nice-data/streaming", "nice-persistence"]
tracing-bridge = ["nice-common/tracing-bridge"]

[package.metadata.cargo-machete]
ignored = [
  "nice-persistence",
] # Optional dep activated only via the streaming feature

[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
features = ["defi", "live", "streaming", "tracing-bridge"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nice-common = { workspace = true }
nice-core = { workspace = true }
nice-data = { workspace = true }
nice-execution = { workspace = true }
nice-model = { workspace = true }
nice-portfolio = { workspace = true }
nice-risk = { workspace = true }
nice-trading = { workspace = true }

nice-persistence = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
bon = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true, optional = true }
log = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true }
ustr = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
nice-model = { workspace = true, features = ["test-support"] }
nice-serialization = { workspace = true }
nice-testkit = { workspace = true, default-features = false, features = [
  "testers",
] }

async-trait = { workspace = true }
bytes = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
