[package]
name = "nice-indicators"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Technical indicators for the nice trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nice_indicators"
crate-type = ["rlib"]

[features]
default = []


[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nice-core = { workspace = true }
nice-model = { workspace = true }

anyhow = { workspace = true }
arraydeque = { workspace = true }
strum = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
nice-model = { workspace = true, features = ["test-support"] }

proptest = { workspace = true }
rstest = { workspace = true }
