[package]
name = "nice-network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Network communication machinery for the nice trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nice_network"
crate-type = ["rlib"]

[features]
default = ["transport-sockudo"]
simulation = ["dep:madsim", "nice-core/simulation"]
turmoil = ["dep:turmoil"]
# Backend selection for the WebSocket transport abstraction.
# `tokio-tungstenite` is always compiled; `transport-sockudo` (enabled by
# default) adds the `sockudo-ws` backend, selectable at runtime via
# `WebSocketConfig.backend`. Disable via `default-features = false` to drop
# the sockudo dependency.
transport-sockudo = ["dep:sockudo-ws"]

[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
features = ["simulation", "transport-sockudo", "turmoil"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nice-core = { workspace = true }
nice-cryptography = { workspace = true }

ahash = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
bon = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_urlencoded = { workspace = true }
socket2 = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }
ustr = { workspace = true }
webpki-roots = { workspace = true }

madsim = { workspace = true, optional = true }

sockudo-ws = { workspace = true, optional = true }
turmoil = { workspace = true, optional = true }

[dev-dependencies]
#nice-common = { workspace = true, features = ["live"] }

axum = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
rcgen = { workspace = true }
rstest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
turmoil = { workspace = true }

[[bench]]
name = "ratelimiter"
path = "benches/ratelimiter.rs"
harness = false

[[bench]]
name = "http_response"
path = "benches/http_response.rs"
harness = false

[[bench]]
name = "websocket_transport"
path = "benches/websocket_transport.rs"
harness = false
required-features = ["transport-sockudo"]

[[bench]]
name = "websocket_latency"
path = "benches/websocket_latency.rs"
harness = false
required-features = ["transport-sockudo"]
