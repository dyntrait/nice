[package]
name = "nice-deribit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Deribit exchange integration adapter for the nice trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nice_deribit"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
arrow = ["dep:arrow", "nice-serialization"]
examples = ["nice-live/node", "nice-network/transport-sockudo"]


high-precision = [
  "nice-model/high-precision",
  "nice-serialization?/high-precision",
]

[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
features = ["arrow", "examples", "high-precision"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nice-common = { workspace = true, features = ["live"] }
nice-core = { workspace = true }
nice-live = { workspace = true }
nice-model = { workspace = true }
nice-network = { workspace = true, features = ["transport-sockudo"] }
nice-persistence-macros = { workspace = true }
nice-serialization = { workspace = true, features = [
  "arrow",
], optional = true }
nice-system = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
bon = { workspace = true }
derive_builder = { workspace = true }
dotenvy = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
rust_decimal = { workspace = true, features = ["serde-with-float"] }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
ustr = { workspace = true }
zeroize = { workspace = true }

arrow = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
pyo3-async-runtimes = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
nice-testkit = { workspace = true, default-features = false, features = [
  "testers",
] }
nice-trading = { workspace = true }

axum = { workspace = true }
criterion = { workspace = true }
dashmap = { workspace = true }
rstest = { workspace = true }
rust_decimal_macros = { workspace = true }
toml = { workspace = true }

# Run with `cargo bench -p nice-deribit --bench websocket`
[[bench]]
name = "websocket"
harness = false

# Run with `cargo run -p nice-deribit --bin deribit-http-public`
[[bin]]
name = "deribit-http-public"
path = "bin/http_public.rs"
doc = false
test = false

# Run with `cargo run -p nice-deribit --bin deribit-http-private`
[[bin]]
name = "deribit-http-private"
path = "bin/http_private.rs"
doc = false
test = false

# Run with `cargo run -p nice-deribit --bin deribit-ws-data`
[[bin]]
name = "deribit-ws-data"
path = "bin/ws_data.rs"
doc = false
test = false

# Run with `cargo run -p nice-deribit --example deribit-data-tester --features examples`
[[example]]
name = "deribit-data-tester"
path = "examples/node_data_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run -p nice-deribit --example deribit-exec-tester --features examples`
[[example]]
name = "deribit-exec-tester"
path = "examples/node_exec_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run -p nice-deribit --example deribit-greeks-tester --features examples`
[[example]]
name = "deribit-greeks-tester"
path = "examples/node_greeks.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run -p nice-deribit --example deribit-option-chain-tester --features examples`
[[example]]
name = "deribit-option-chain"
path = "examples/node_option_chain.rs"
required-features = ["examples"]
doc = false
