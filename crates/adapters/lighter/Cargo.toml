[package]
name = "nice-lighter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Lighter integration adapter for the nice trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nice_lighter"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
fuzz = ["nice-live/fuzz"]
examples = [
  "dep:reqwest",
  "nice-live/node",
  "nice-network/transport-sockudo",
]


high-precision = ["nice-model/high-precision"]

[package.metadata]
cargo-fuzz = true

[package.metadata.cargo-machete]
ignored = [
  "nice-system",
] # Optional dep activated only via the python feature

[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
features = ["examples", "high-precision"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nice-common = { workspace = true, features = ["live"] }
nice-core = { workspace = true }
nice-live = { workspace = true }
nice-model = { workspace = true }
nice-network = { workspace = true, features = ["transport-sockudo"] }
nice-system = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bon = { workspace = true }
dashmap = { workspace = true }
derive_builder = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, optional = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_repr = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }
ustr = { workspace = true }
zeroize = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-async-runtimes = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
nice-testkit = { workspace = true, default-features = false, features = [
  "testers",
] }
nice-trading = { workspace = true }

axum = { workspace = true }
criterion = { workspace = true }
dotenvy = { workspace = true }
iai = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }

[[bench]]
name = "signing_sign_verify"
path = "benches/signing_sign_verify.rs"
harness = false

[[bench]]
name = "signing_poseidon2"
path = "benches/signing_poseidon2.rs"
harness = false

[[bench]]
name = "signing_field"
path = "benches/signing_field.rs"
harness = false

[[bench]]
name = "signing_curve"
path = "benches/signing_curve.rs"
harness = false

[[bench]]
name = "signing_field_iai"
path = "benches/signing_field_iai.rs"
harness = false

[[bench]]
name = "data"
path = "benches/data.rs"
harness = false

[[bench]]
name = "exec"
path = "benches/exec.rs"
harness = false

[[bench]]
name = "micros"
path = "benches/micros.rs"
harness = false

# cargo run -p nice-lighter --bin lighter-flatten
[[bin]]
name = "lighter-flatten"
path = "bin/flatten.rs"
doc = false
test = false

# cargo run -p nice-lighter --bin lighter-integrator-revoke [testnet]
[[bin]]
name = "lighter-integrator-revoke"
path = "bin/integrator_revoke.rs"
doc = false
test = false

# cargo run -p nice-lighter --bin lighter-trades-probe --features examples
[[bin]]
name = "lighter-trades-probe"
path = "bin/trades_probe.rs"
required-features = ["examples"]
doc = false
test = false

[[bin]]
name = "fuzz-verify"
path = "fuzz/fuzz_targets/fuzz_verify.rs"
