bench = false

[[bin]]
name = "fuzz-point-decode"
path = "fuzz/fuzz_targets/fuzz_point_decode.rs"
required-features = ["fuzz"]
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-signature-codec"
path = "fuzz/fuzz_targets/fuzz_signature_codec.rs"
required-features = ["fuzz"]
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-hash-no-pad"
path = "fuzz/fuzz_targets/fuzz_hash_no_pad.rs"
required-features = ["fuzz"]
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-auth-message"
path = "fuzz/fuzz_targets/fuzz_auth_message.rs"
required-features = ["fuzz"]
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-compute-tx-hash"
path = "fuzz/fuzz_targets/fuzz_compute_tx_hash.rs"
required-features = ["fuzz"]
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-scalar-mul-ct-diff"
path = "fuzz/fuzz_targets/fuzz_scalar_mul_ct_diff.rs"
required-features = ["fuzz"]
test = false
doc = false
bench = false

# Run with `cargo run --example lighter-data-tester --package nice-lighter --features examples`.
[[example]]
name = "lighter-data-tester"
path = "examples/node_data_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run --example lighter-exec-tester --package nice-lighter --features examples`.
[[example]]
name = "lighter-exec-tester"
path = "examples/node_exec_tester.rs"
required-features = ["examples"]
doc = false
