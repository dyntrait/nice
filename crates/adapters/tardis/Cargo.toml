[package]
name = "nice-tardis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Tardis integration adapter for the nice trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nice_tardis"
crate-type = ["rlib"]

[features]
default = ["replay", "high-precision"]
examples = ["nice-live/node"]


replay = []
high-precision = [
  "nice-model/high-precision",
  "nice-serialization/high-precision",
]

[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
features = ["examples", "high-precision", "replay"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nice-common = { workspace = true, features = ["live"] }
nice-core = { workspace = true }
nice-live = { workspace = true }
nice-model = { workspace = true }
nice-network = { workspace = true }
nice-persistence = { workspace = true }
nice-serialization = { workspace = true, features = ["arrow"] }
nice-system = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
arrow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
csv = { workspace = true }
derive_builder = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
parquet = { workspace = true, features = ["snap", "zstd"] }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
ryu = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
ustr = { workspace = true }
zeroize = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-async-runtimes = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
axum = { workspace = true }
criterion = { workspace = true }
dotenvy = { workspace = true }
nice-testkit = { workspace = true, default-features = false, features = [
  "datasets",
  "testers",
] }
rstest = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

[[bench]]
name = "messages"
harness = false

[[bin]]
name = "tardis-csv"
path = "bin/example_csv.rs"
doc = false
test = false

[[bin]]
name = "tardis-http"
path = "bin/example_http.rs"
doc = false
test = false

[[bin]]
name = "tardis-replay"
path = "bin/example_replay.rs"
required-features = ["replay"]
doc = false
test = false

# Run with `cargo run --bin stream-deltas-bench --profile bench`
[[bin]]
name = "stream-deltas-bench"
path = "bin/stream_deltas_bench.rs"
doc = false
test = false

# Run with `cargo run --example tardis-data-tester -p nice-tardis --features examples`
[[example]]
name = "tardis-data-tester"
path = "examples/node_data_tester.rs"
required-features = ["examples"]
doc = false
