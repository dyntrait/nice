[package]
name = "nice-hyperliquid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Hyperliquid integration adapter for the nice trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nice_hyperliquid"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
arrow = ["dep:arrow", "nice-serialization"]
examples = ["nice-live/node", "nice-network/transport-sockudo"]


high-precision = [
  "nice-model/high-precision",
  "nice-serialization?/high-precision",
]

[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
features = ["arrow", "examples", "high-precision"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nice-common = { workspace = true, features = ["live"] }
nice-core = { workspace = true }
nice-live = { workspace = true }
nice-model = { workspace = true }
nice-network = { workspace = true, features = ["transport-sockudo"] }
nice-persistence-macros = { workspace = true }
nice-serialization = { workspace = true, features = [
  "arrow",
], optional = true }
nice-system = { workspace = true, optional = true }

ahash = { workspace = true }
alloy = { workspace = true, features = ["sol-types", "signer-local"] }
alloy-primitives = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
dashmap = { workspace = true }
derive_builder = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
rmp-serde = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }
ustr = { workspace = true }
zeroize = { workspace = true }

arrow = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
pyo3-async-runtimes = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
nice-persistence = { workspace = true }
nice-testkit = { workspace = true, default-features = false, features = [
  "testers",
] }
nice-trading = { workspace = true }

axum = { workspace = true }
criterion = { workspace = true }
dotenvy = { workspace = true }
futures-util = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
toml = { workspace = true }

[[bench]]
name = "signing"
harness = false

[[bench]]
name = "data"
harness = false

[[bench]]
name = "exec"
harness = false

[[bench]]
name = "micros"
harness = false

[[bin]]
name = "hyperliquid-http-public"
path = "bin/http_public.rs"
doc = false
test = false

[[bin]]
name = "hyperliquid-http-private"
path = "bin/http_private.rs"
doc = false
test = false

[[bin]]
name = "hyperliquid-ws-data"
path = "bin/ws_data.rs"
doc = false
test = false

[[bin]]
name = "hyperliquid-ws-exec"
path = "bin/ws_exec.rs"
doc = false
test = false

[[bin]]
name = "hyperliquid-http-exec"
path = "bin/http_exec.rs"
doc = false
test = false

[[bin]]
name = "hyperliquid-http-user-outcome"
path = "bin/http_user_outcome.rs"
doc = false
test = false

[[bin]]
name = "hyperliquid-http-outcome-order"
path = "bin/http_outcome_order.rs"
doc = false
test = false

[[bin]]
name = "hyperliquid-capture-test-data"
path = "bin/capture_test_data.rs"
doc = false
test = false

# Run with `cargo run -p nice-hyperliquid --bin hyperliquid-flatten`.
[[bin]]
name = "hyperliquid-flatten"
path = "bin/flatten.rs"
doc = false
test = false

[[bin]]
name = "hyperliquid-builder-fee-approve"
path = "bin/builder_fee_approve.rs"
doc = false
test = false

[[bin]]
name = "hyperliquid-builder-fee-revoke"
path = "bin/builder_fee_revoke.rs"
doc = false
test = false

# Run with `cargo run --example hyperliquid-data-tester --package nice-hyperliquid --features examples`.
[[example]]
name = "hyperliquid-data-tester"
path = "examples/node_data_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run --example hyperliquid-exec-tester --package nice-hyperliquid --features examples`.
[[example]]
name = "hyperliquid-exec-tester"
path = "examples/node_exec_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run --example hyperliquid-outcome-exec-tester --package nice-hyperliquid --features examples`.
[[example]]
name = "hyperliquid-outcome-exec-tester"
path = "examples/node_outcome_exec_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run --example hyperliquid-chained-modify-smoke --package nice-hyperliquid --features examples`.
[[example]]
name = "hyperliquid-chained-modify-smoke"
path = "examples/chained_modify_smoke.rs"
required-features = ["examples"]
doc = false
