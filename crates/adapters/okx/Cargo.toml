[package]
name = "nice-okx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "OKX exchange integration adapter for the nice trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nice_okx"
crate-type = ["rlib"]

[features]
default = ["high-precision"]


high-precision = ["nice-model/high-precision"]
simulation = [
  "nice-common/simulation",
  "nice-core/simulation",
  "nice-live/simulation",
  "nice-network/simulation",
]
examples = [
  "nice-live/node",
  "nice-network/transport-sockudo",
  "nice-trading/examples",
]

[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
features = ["examples", "high-precision"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nice-common = { workspace = true, features = ["live"] }
nice-core = { workspace = true }
nice-live = { workspace = true }
nice-model = { workspace = true }
nice-network = { workspace = true, features = ["transport-sockudo"] }
nice-system = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
bon = { workspace = true }
dashmap = { workspace = true }
derive_builder = { workspace = true }
dotenvy = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
ustr = { workspace = true }
zeroize = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-async-runtimes = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
nice-testkit = { workspace = true, default-features = false, features = [
  "testers",
] }
nice-trading = { workspace = true }

axum = { workspace = true }
criterion = { workspace = true }
rstest = { workspace = true }
rust_decimal_macros = { workspace = true }
toml = { workspace = true }

# Canonical benches; see crates/adapters/okx/benches/BENCHMARKS.md for context
[[bench]]
name = "data"
harness = false

[[bench]]
name = "exec"
harness = false

[[bench]]
name = "micros"
harness = false

[[bench]]
name = "signing"
harness = false

[[bin]]
name = "okx-http-public"
path = "bin/http_public.rs"
doc = false
test = false

[[bin]]
name = "okx-http-private"
path = "bin/http_private.rs"
doc = false
test = false

[[bin]]
name = "okx-ws-data"
path = "bin/ws_data.rs"
doc = false
test = false

[[bin]]
name = "okx-ws-exec"
path = "bin/ws_exec.rs"
doc = false
test = false

# Run with `cargo run -p nice-okx --bin okx-flatten`.
[[bin]]
name = "okx-flatten"
path = "bin/flatten.rs"
doc = false
test = false

# Run with `cargo run --example okx-data-tester --package nice-okx --features examples`.
[[example]]
name = "okx-data-tester"
path = "examples/node_data_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run --example okx-greeks-tester --package nice-okx --features examples`.
[[example]]
name = "okx-greeks-tester"
path = "examples/node_greeks.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run --example okx-exec-tester --package nice-okx --features examples`.
[[example]]
name = "okx-exec-tester"
path = "examples/node_exec_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run --example okx-delta-neutral --package nice-okx --features examples`.
[[example]]
name = "okx-delta-neutral"
path = "examples/node_delta_neutral.rs"
required-features = ["examples"]
doc = false
