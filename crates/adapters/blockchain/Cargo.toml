[package]
name = "nice-blockchain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Blockchain and DeFi integration adapter for the nice trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nice_blockchain"
crate-type = ["rlib"]

[features]
default = []

hypersync = ["hypersync-client", "nice-live/node"]

turmoil = ["dep:turmoil", "nice-network/turmoil"]

[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
features = ["hypersync", "turmoil"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nice-common = { workspace = true, features = ["defi", "live"] }
nice-core = { workspace = true }
nice-infrastructure = { workspace = true, features = ["postgres"] }
nice-live = { workspace = true, features = ["defi"] }
nice-model = { workspace = true, features = ["defi"] }
nice-network = { workspace = true, features = ["transport-sockudo"] }
nice-system = { workspace = true, optional = true }

ahash = { workspace = true }
alloy = { workspace = true, features = ["contract", "signer-local"] }
anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
bon = { workspace = true }
bytes = { workspace = true }
dotenvy = { workspace = true }
enum_dispatch = { workspace = true }
futures-util = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
ustr = { workspace = true }
zeroize = { workspace = true }

hypersync-client = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }
turmoil = { workspace = true, optional = true }

[dev-dependencies]
nice-model = { workspace = true, features = ["test-support"] }
nice-trading = { workspace = true }

axum = { workspace = true }
rstest = { workspace = true }
toml = { workspace = true }
turmoil = { workspace = true }

[[bin]]
name = "node-wallet"
path = "bin/node_wallet.rs"
required-features = ["hypersync"]
doc = false
test = false

[[example]]
name = "blockchain-data-tester"
path = "examples/node_data_tester.rs"
required-features = ["hypersync"]
doc = false
