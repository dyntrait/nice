[package]
name = "nice-kraken"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Kraken Pro exchange integration adapter for the nice trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nice_kraken"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
examples = [
  "dep:nice-backtest",
  "dep:nice-tardis",
  "nice-live/node",
  "nice-network/transport-sockudo",
  "nice-trading/examples",
]


high-precision = ["nice-model/high-precision"]

[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
features = ["examples", "high-precision"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nice-common = { workspace = true, features = ["live"] }
nice-core = { workspace = true }
nice-live = { workspace = true }
nice-model = { workspace = true }
nice-network = { workspace = true, features = ["transport-sockudo"] }
nice-system = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
bon = { workspace = true }
dashmap = { workspace = true }
derive_builder = { workspace = true }
futures-util = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
serde_urlencoded = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
ustr = { workspace = true }
zeroize = { workspace = true }

nice-backtest = { workspace = true, optional = true }
nice-tardis = { workspace = true, optional = true }

pyo3 = { workspace = true, optional = true }
pyo3-async-runtimes = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
nice-testkit = { workspace = true, default-features = false, features = [
  "testers",
] }
nice-trading = { workspace = true }

axum = { workspace = true }
criterion = { workspace = true }
dotenvy = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
toml = { workspace = true }

# Run with `cargo bench -p nice-kraken --bench websocket`
[[bench]]
name = "websocket"
harness = false

[[bin]]
name = "kraken-http-spot-raw"
path = "bin/http_spot_raw.rs"
doc = false
test = false

[[bin]]
name = "kraken-http-spot-public"
path = "bin/http_spot_public.rs"
doc = false
test = false

[[bin]]
name = "kraken-ws-spot-data"
path = "bin/ws_spot_data.rs"
doc = false
test = false

# Run with `cargo run -p nice-kraken --example kraken-data-tester --features examples`
[[example]]
name = "kraken-data-tester"
path = "examples/node_data_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run -p nice-kraken --example kraken-exec-tester --features examples`
[[example]]
name = "kraken-exec-tester"
path = "examples/node_exec_tester.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run -p nice-kraken --features examples --example kraken-hurst-vpin-backtest --release`
[[example]]
name = "kraken-hurst-vpin-backtest"
path = "examples/engine_hurst_vpin_backtest.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run -p nice-kraken --features examples --example kraken-hurst-vpin-live`
[[example]]
name = "kraken-hurst-vpin-live"
path = "examples/node_hurst_vpin_live.rs"
required-features = ["examples"]
doc = false
