[package]
name = "nice-coinbase"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Coinbase Advanced Trade integration adapter for the nice trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nice_coinbase"
crate-type = ["rlib"]

[features]
default = ["high-precision"]


high-precision = ["nice-model/high-precision"]
examples = [
  "nice-live/node",
  "nice-network/transport-sockudo",
  "nice-trading/examples",
]

[package.metadata.cargo-machete]
ignored = [
  "nice-system",
] # Optional dep activated only via the python feature

[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
features = ["examples", "high-precision"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nice-common = { workspace = true, features = ["live"] }
nice-core = { workspace = true }
nice-live = { workspace = true }
nice-model = { workspace = true }
nice-network = { workspace = true, features = ["transport-sockudo"] }
nice-system = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
bon = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
pem = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }
ustr = { workspace = true }
zeroize = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
nice-testkit = { workspace = true, default-features = false, features = [
  "testers",
] }
nice-trading = { workspace = true }

axum = { workspace = true }
dotenvy = { workspace = true }
futures-util = { workspace = true }
rstest = { workspace = true }
toml = { workspace = true }

[[bin]]
name = "coinbase-http-public"
path = "bin/http_public.rs"
doc = false
test = false

[[bin]]
name = "coinbase-cancel-all-open"
path = "bin/cancel_all_open.rs"
doc = false
test = false

[[bin]]
name = "coinbase-http-private"
path = "bin/http_private.rs"
doc = false
test = false

[[example]]
name = "coinbase-data-tester"
path = "examples/node_data_tester.rs"
required-features = ["examples"]
doc = false

[[example]]
name = "coinbase-exec-tester"
path = "examples/node_exec_tester.rs"
required-features = ["examples"]
doc = false
