[package]
name = "nice-interactive-brokers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Interactive Brokers integration adapter for the nice trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nice_interactive_brokers"
crate-type = ["rlib"]

[features]
default = ["execution"]
execution = ["dep:nice-execution", "dep:nice-network"]
examples = ["nice-live/node", "nice-trading/examples"]
extension-module = [
  "gateway",
]

gateway = ["bollard"]

[package.metadata.cargo-machete]
ignored = [
  "nice-execution", # Activated by the `execution` feature for downstream feature chaining
  "nice-network", # Activated by the `execution` feature for downstream feature chaining
]

[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
features = ["examples", "execution", "gateway"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nice-common = { workspace = true }
nice-core = { workspace = true }
nice-live = { workspace = true }
nice-model = { workspace = true }

nice-execution = { workspace = true, optional = true }
nice-network = { workspace = true, optional = true }
nice-system = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }
ibapi = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
ustr = { workspace = true }

bollard = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
pyo3-async-runtimes = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
nice-testkit = { workspace = true, default-features = false, features = [
  "testers",
] }
nice-trading = { workspace = true }
rstest = { workspace = true }
rust_decimal_macros = { workspace = true }
tempfile = { workspace = true }

# Run live smoke with `cargo run --example ib-data-tester --package nice-interactive-brokers --features examples`.
# Run embedded config unit tests with `cargo test --example ib-data-tester --package nice-interactive-brokers --features examples`.
[[example]]
name = "ib-data-tester"
path = "examples/node_data_tester.rs"
required-features = ["examples"]
doc = false

# Run live smoke with `cargo run --example ib-exec-tester --package nice-interactive-brokers --features examples`.
# Run embedded config unit tests with `cargo test --example ib-exec-tester --package nice-interactive-brokers --features examples`.
[[example]]
name = "ib-exec-tester"
path = "examples/node_exec_tester.rs"
required-features = ["examples"]
doc = false
