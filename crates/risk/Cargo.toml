[package]
name = "nice-risk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Core risk management machinery for the nice trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nice_risk"
crate-type = ["rlib"]

[features]
default = []


[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nice-common = { workspace = true }
nice-core = { workspace = true }
nice-execution = { workspace = true }
nice-model = { workspace = true }
nice-portfolio = { workspace = true }

ahash = { workspace = true }
bon = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde = { workspace = true }
ustr = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
nice-model = { workspace = true, features = ["test-support"] }

rstest = { workspace = true }
