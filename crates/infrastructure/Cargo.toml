[package]
name = "nice-infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Infrastructure components for the nice trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nice_infrastructure"
crate-type = ["rlib"]

[features]
default = ["redis"] # redis needed by `nice_trader` by default for now
redis = ["dep:redis"]
postgres = ["dep:sqlx"]

[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
features = ["postgres", "redis"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nice-common = { workspace = true, features = ["live"] }
nice-core = { workspace = true }
nice-cryptography = { workspace = true }
nice-model = { workspace = true }

ahash = { workspace = true }
anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
derive_builder = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
rmp-serde = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
ustr = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-async-runtimes = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }

[dev-dependencies]
nice-live = { workspace = true, features = ["node"] }
nice-model = { workspace = true, features = ["test-support"] }
nice-persistence = { workspace = true }
nice-serialization = { workspace = true }

criterion = { workspace = true }
rstest = { workspace = true }
serde = { workspace = true }
strum = { workspace = true }
toml = { workspace = true }

[[bench]]
name = "redis_msgbus"
harness = false
required-features = ["redis"]
