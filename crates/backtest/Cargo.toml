[package]
name = "nice-backtest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Core backtesting machinery for the nice trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nice_backtest"
crate-type = ["rlib"]

[features]
default = []
examples = ["nice-trading/examples"]
high-precision = ["nice-model/high-precision"]
mimalloc = ["dep:mimalloc"]
defi = ["nice-common/defi", "nice-data/defi", "nice-model/defi"]
plugin = []
streaming = ["nice-persistence", "nice-system/streaming"]


[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
features = ["defi", "examples", "high-precision", "plugin", "streaming"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nice-analysis = { workspace = true }
nice-common = { workspace = true }
nice-core = { workspace = true }
nice-data = { workspace = true }
nice-execution = { workspace = true }
nice-model = { workspace = true }
nice-persistence = { workspace = true, optional = true }
nice-portfolio = { workspace = true }
nice-risk = { workspace = true }
nice-system = { workspace = true }
nice-trading = { workspace = true }

ahash = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
bon = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
ustr = { workspace = true }

mimalloc = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }
serde_json = { workspace = true }

[dev-dependencies]
nice-indicators = { workspace = true }
nice-model = { workspace = true, features = ["test-support"] }
nice-persistence = { workspace = true }
nice-testkit = { workspace = true, default-features = false, features = [
  "datasets",
  "testers",
] }
nice-trading = { workspace = true, features = ["examples"] }

criterion = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }

# Run with `cargo bench -p nice-backtest --bench engine`
[[bench]]
name = "engine"
path = "benches/engine.rs"
harness = false

# Run with `cargo run -p nice-backtest --features examples --example engine-ema-cross`
[[example]]
name = "engine-ema-cross"
path = "examples/engine_ema_cross.rs"
required-features = ["examples"]
doc = false

# Run with `cargo run -p nice-backtest --features examples,streaming --example node-ema-cross`
[[example]]
name = "node-ema-cross"
path = "examples/node_ema_cross.rs"
required-features = ["examples", "streaming"]
doc = false

# Run with `nice_TARDIS_OPTION_CATALOG=/path/to/catalog cargo run -p nice-backtest --features examples,streaming --example tardis-option-chain`
[[example]]
name = "tardis-option-chain"
path = "examples/tardis_option_chain.rs"
required-features = ["examples", "streaming"]
doc = false
