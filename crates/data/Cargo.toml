[package]
name = "nice-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Core data handling machinery for the nice trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nice_data"
crate-type = ["rlib"]

[features]
default = []
streaming = ["nice-persistence"]
high-precision = [
  "nice-model/high-precision",
  "nice-serialization/high-precision",
]


defi = [
  "nice-common/defi",
  "nice-model/defi",
  "nice-persistence?/defi",
  "alloy-primitives",
]

[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
features = ["defi", "high-precision", "streaming"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nice-common = { workspace = true }
nice-core = { workspace = true }
nice-model = { workspace = true }
nice-persistence = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ustr = { workspace = true }

alloy-primitives = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
nice-model = { workspace = true, features = ["test-support"] }
nice-serialization = { workspace = true, features = ["arrow"] }

criterion = { workspace = true }
parking_lot = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }

# Run with `cargo bench -p nice-data --bench engine`
[[bench]]
name = "engine"
harness = false

# Run with `cargo bench -p nice-data --bench aggregation`
[[bench]]
name = "aggregation"
harness = false
