[package]
name = "nice-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Testing utilities for the nice trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nice_testkit"
crate-type = ["rlib"]

[features]
default = ["datasets", "testers"]
datasets = [
  "dep:ahash",
  "dep:anyhow",
  "dep:aws-lc-rs",
  "dep:itchy",
  "dep:nice-model",
  "dep:nice-network",
  "dep:nice-serialization",
  "dep:parquet",
  "dep:rand",
  "dep:reqwest",
  "dep:serde_json",
]
testers = [
  "dep:ahash",
  "dep:anyhow",
  "dep:async-trait",
  "dep:bon",
  "dep:bytes",
  "dep:jiff",
  "dep:indexmap",
  "dep:log",
  "dep:nice-model",
  "dep:nice-trading",
  "dep:rust_decimal",
  "dep:serde",
  "dep:ustr",
]


high-precision = [
  "nice-model?/high-precision",
  "nice-serialization?/high-precision",
]

[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
features = ["high-precision"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nice-common = { workspace = true }
nice-core = { workspace = true }
nice-model = { workspace = true, features = [
  "test-support",
], optional = true }
nice-network = { workspace = true, optional = true }
nice-serialization = { workspace = true, features = [
  "arrow",
], optional = true }
nice-trading = { workspace = true, optional = true }

ahash = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
aws-lc-rs = { workspace = true, optional = true }
bon = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true }
itchy = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
log = { workspace = true, optional = true }
parking_lot = { workspace = true }
parquet = { workspace = true, features = ["zstd"], optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["blocking"], optional = true }
rust_decimal = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true }
ustr = { workspace = true, optional = true }

pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
nice-model = { workspace = true, features = ["test-support"] }
nice-portfolio = { workspace = true }

arrow = { workspace = true }
axum = { workspace = true }
indexmap = { workspace = true }
rstest = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["datasets"]
