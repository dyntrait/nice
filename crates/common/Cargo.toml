[package]
name = "nice-common"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Common functionality and machinery for the nice trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true
build = "build.rs"

[lints]
workspace = true

[lib]
name = "nice_common"
crate-type = ["rlib", "staticlib"]

[features]
default = ["rstest"]
live = ["tokio"]


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nice-core = { workspace = true }
nice-model = { workspace = true, features = ["stubs","defi"] }
nice-indicators = { workspace = true, optional = true }
ahash = { workspace = true }
anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
derive_builder = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
sysinfo = { workspace = true }
thousands = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = {workspace = true}
ustr = { workspace = true }

alloy-primitives = { workspace = true, optional = true }

rstest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
capnp = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
vergen = { workspace = true, features = ["build", "cargo", "rustc", "si"] }


[[bench]]
name = "cache_orders"
path = "benches/cache/orders.rs"
harness = false

[[bench]]
name = "matching"
path = "benches/matching.rs"
harness = false

[[bench]]
name = "cache_query_sets"
path = "benches/cache/query_sets.rs"
harness = false
