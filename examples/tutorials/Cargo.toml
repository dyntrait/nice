[package]
name = "nice-tutorials"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Runnable tutorial examples for niceTrader"
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
examples = [
  "dep:dotenvy",
  "dep:nice-common",
  "dep:nice-core",
  "dep:nice-databento",
  "dep:nice-lighter",
  "dep:nice-live",
  "dep:nice-model",
  "dep:nice-trading",
  "dep:tokio",
]

[dependencies]
nice-common = { workspace = true, features = ["live"], optional = true }
nice-core = { workspace = true, optional = true }
nice-databento = { workspace = true, features = [
  "high-precision",
  "live",
], optional = true }
nice-lighter = { workspace = true, features = [
  "examples",
  "high-precision",
], optional = true }
nice-live = { workspace = true, features = ["node"], optional = true }
nice-model = { workspace = true, features = [
  "high-precision",
], optional = true }
nice-trading = { workspace = true, features = [
  "examples",
  "high-precision",
], optional = true }

dotenvy = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[[bin]]
name = "lighter-nvda-composite-mm"
path = "src/bin/lighter_nvda_composite_mm.rs"
required-features = ["examples"]
doc = false
test = false
